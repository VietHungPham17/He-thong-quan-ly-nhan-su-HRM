{% extends 'base.html' %}
{% block title %}Xóa nhân viên{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body text-center py-5">
                <div class="mb-3" style="font-size:3rem;color:#dc3545"><i class="fas fa-triangle-exclamation"></i></div>
                <h5 class="mb-2">Xác nhận xóa nhân viên</h5>
                <p class="text-muted mb-4">Bạn có chắc chắn muốn xóa nhân viên <strong>{{ object.full_name }}</strong> ({{ object.employee_id }})? Hành động này không thể hoàn tác.</p>
                <form method="post" class="d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-1"></i>Xóa</button>
                    <a href="{% url 'employees:employee_list' %}" class="btn btn-outline-secondary">Hủy</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
